[project]
name = "library"
version = "0.1.0"
description = "учебный проект API для управления библиотекой"
authors = [
    {name = "PAST666",email = "alex66651@yandex.ru"}
]
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "django (>=5.1.7,<6.0.0)"
]

[dependency-groups]
dev = [
    "flake8 (>=7.2.0,<8.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "flake8-quotes (>=3.4.0,<4.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false
